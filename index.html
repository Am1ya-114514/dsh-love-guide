<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Android 那三个 `maximum-scale` / `user-scalable=no` 是必要的：WebView 默认允许双指缩放，
      而这是个固定布局的应用，一旦被缩放整个界面就错位了。`viewport-fit=cover` 是为了让
      内容铺到刘海/圆角下面，安全区由 CSS 的 env(safe-area-inset-*) 自己让开。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="dsh-Love Guide：把关系决策方法论做成本地可运行的工作台，自带可配置的 agent API、证据台账与聊天记录推演。"
    />
    <title>dsh-Love Guide</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
