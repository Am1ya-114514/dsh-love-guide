allowBuilds:
  # 我们走的是 NSIS 安装包，用不到 Squirrel/electron-winstaller 的构建脚本，
  # 显式设成 false 让 pnpm 不再把「被忽略的构建脚本」当错误。
  electron-winstaller: false
# pnpm 11 起，安装脚本白名单从这个文件读（package.json 里的 pnpm 字段已不再生效）。
# electron 的 postinstall 负责下载那个 100+MB 的平台二进制，必须放行，
# 否则 node_modules/electron/dist 是空的，一启动就报 "Electron failed to install correctly"。
onlyBuiltDependencies:
  - electron
